<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#C0392B">
  <meta name="description" content="牛・豚・鶏・ホルモン・その他の肉の部位を、位置・食感・調理法・別名・栄養でわかりやすく調べられる図鑑アプリ。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>肉の部位図鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="app-title">
      <svg class="ic logo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13C5 8 9 5 14 5c5 0 6.5 4 6 8-1 4-5 6-8 6-5 0-7-2-7-6Z"/><circle cx="10.5" cy="13" r="2.2"/></svg>
      <span>肉の部位図鑑 <small>牛・豚・鶏・ホルモン・その他</small></span>
    </div>

    <div class="search-wrap">
      <svg class="ic search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="search" id="search" placeholder="部位名・別名・英語名・料理で検索" autocomplete="off" aria-label="部位を検索">
    </div>

    <div class="mode-bar" role="tablist" aria-label="表示モード">
      <button class="mode-btn active" data-mode="home" role="tab">
        <span class="m-top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>家庭</span>
        <span class="m-sub">調理法重視</span>
      </button>
      <button class="mode-btn" data-mode="yakiniku" role="tab">
        <span class="m-top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1.5 3-1.5 4.2-1.5 7A1.8 1.8 0 0012 11c0-2 1.5-2.4 1-4 2 1.8 3 3.6 3 6a4 4 0 11-8 0c0-3.2 2.5-4.6 4-10Z"/></svg>焼肉</span>
        <span class="m-sub">呼び名・希少</span>
      </button>
      <button class="mode-btn" data-mode="nutrition" role="tab">
        <span class="m-top"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="8" x2="4" y2="16"/><line x1="7" y1="6" x2="7" y2="18"/><line x1="17" y1="6" x2="17" y2="18"/><line x1="20" y1="8" x2="20" y2="16"/><line x1="7" y1="12" x2="17" y2="12"/></svg>栄養</span>
        <span class="m-sub">カロリー比較</span>
      </button>
    </div>
  </header>

  <nav class="cat-bar" id="catBar" aria-label="肉の種類"></nav>

  <div class="count-line"><span id="count"></span> を表示中</div>

  <main class="grid" id="grid"></main>

  <div class="foot">
    <b>ご注意：</b>栄養値は100gあたりの<b>目安</b>です（文部科学省 食品成分DB 八訂 増補2023年を基準）。
    牛肉は和牛／輸入／等級でカロリー・脂質が大きく変動します。正確な値は
    食品成分データベースでご確認ください。<br>
    主な出典：農林水産省「お肉丸わかり図鑑」／日本食肉格付協会(JMGA)／
    食品流通構造改善促進機構(OFSI)海外名称対応表／CMPC／日本ハム。
  </div>

  <!-- 詳細シート -->
  <div class="sheet-overlay" id="sheetOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head" id="sheetHead"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
